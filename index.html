<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>TrailQuest</title>
  <style>
    :root {
      --bg-main: #6b8a63;
      --header-bg: #DFE9CD;
      --panel-bg: #2a312b;
      --text-primary: #f2efe8;
      --text-secondary: #c5beb0;
      --accent: #6b8a63;
      --accent-dark: #4f6b57;
      --menu-surface: #f4efe4;
      --menu-text: #2b2b2b;
      --field-surface: #fbfaf6;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: Arial, sans-serif;
      background:
        linear-gradient(145deg, rgba(42, 49, 43, 0.84), rgba(42, 49, 43, 0.36)),
        var(--bg-main);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    main {
      width: min(100%, 400px);
      text-align: center;
    }

    .mark {
      width: 148px;
      height: 148px;
      margin: 0 auto 22px;
      border-radius: 28px;
      background: var(--header-bg);
      color: var(--menu-text);
      display: grid;
      place-items: center;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.32);
      position: relative;
      overflow: hidden;
    }

    .mark::before {
      content: "";
      position: absolute;
      inset: 18px 18px auto;
      height: 54px;
      border-radius: 999px;
      background: rgba(107, 138, 99, 0.24);
      transform: rotate(-16deg);
    }

    .mark::after {
      content: "";
      position: absolute;
      left: 28px;
      right: 28px;
      bottom: 24px;
      height: 30px;
      border-top: 8px solid #7a6253;
      border-radius: 50%;
      transform: rotate(-8deg);
    }

    .pin {
      width: 58px;
      height: 58px;
      border-radius: 50% 50% 50% 0;
      background: var(--accent);
      border: 4px solid var(--text-primary);
      transform: rotate(-45deg);
      display: grid;
      place-items: center;
      position: relative;
      z-index: 1;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.24);
    }

    .pin span {
      color: var(--text-primary);
      display: block;
      font-size: 24px;
      font-weight: 700;
      transform: rotate(45deg);
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    p {
      margin: 12px 0 0;
      color: var(--text-secondary);
      font-size: 16px;
      line-height: 1.45;
    }

    .actions {
      display: flex;
      justify-content: center;
      margin-top: 24px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      min-width: 164px;
      padding: 12px 18px;
      border-radius: 999px;
      background: var(--field-surface);
      color: var(--menu-text);
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.22);
      transition: transform 0.14s ease, background-color 0.14s ease;
    }

    .button:active {
      transform: scale(0.97);
      background: var(--header-bg);
    }

    .status {
      min-height: 22px;
    }

    .setup-note {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      background: rgba(244, 239, 228, 0.94);
      color: var(--menu-text);
      font-size: 14px;
      text-align: left;
    }

    .setup-note code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
    }

    @media (prefers-reduced-motion: no-preference) {
      .mark {
        animation: settle 0.42s ease both;
      }

      @keyframes settle {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <div class="pin"><span>TQ</span></div>
    </div>
    <h1>TrailQuest</h1>
    <p class="status" id="statusText">Opening TrailQuest...</p>
    <div class="actions">
      <a class="button" id="launchLink" href="#">Open TrailQuest</a>
    </div>
    <p class="setup-note" id="setupNote">
      Paste the current Google Apps Script <code>/exec</code> URL into
      <code>TRAILQUEST_APP_URL</code> near the bottom of this file.
    </p>
  </main>

  <script>
    const TRAILQUEST_APP_URL = https://script.google.com/macros/s/AKfycbzyClkWyQVQ02ZiNGvynT6XHg1f-wboKjtXDjmPO-jP4gWiBSUBia5WUrnfZa4KYO9e/exec;
    const REDIRECT_DELAY_MS = 650;

    const launchLink = document.getElementById('launchLink');
    const statusText = document.getElementById('statusText');
    const setupNote = document.getElementById('setupNote');

    function isConfigured(url) {
      return /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:[?#].*)?$/.test(url);
    }

    if (isConfigured(TRAILQUEST_APP_URL)) {
      launchLink.href = TRAILQUEST_APP_URL;
      window.setTimeout(() => {
        window.location.replace(TRAILQUEST_APP_URL);
      }, REDIRECT_DELAY_MS);
    } else {
      launchLink.removeAttribute('href');
      launchLink.setAttribute('aria-disabled', 'true');
      statusText.textContent = 'TrailQuest is almost ready.';
      setupNote.style.display = 'block';
    }
  </script>
</body>
</html>
